name: ci

on:
  push:
  pull_request:

# CI only reads the code. Without this the token gets the repo default,
# which can include write access.
permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # gitleaks needs full history, not just the tip
      # Deliberately not gitleaks-action: it scans the push's commit RANGE, which
      # does not resolve on a first push. This scans the whole history, every time.
      - name: gitleaks
        run: |
          VERSION=8.24.3
          SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --no-banner

  test:
    name: lua tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The WoW client is Lua 5.1; PUC Lua 5.1 is built from source here
      # (locally we use LuaJIT, which has the same semantics).
      - uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4
      - name: install busted
        run: luarocks install busted
      - name: fetch embedded libraries
        run: scripts/fetch-libs.sh
      - name: compile every file the client loads
        run: |
          for f in Core/*.lua UI/*.lua Libs/*/*.lua; do luac -p "$f" || exit 1; done
      - name: busted
        run: busted
      - name: headless client smoke
        run: lua tests/client_smoke.lua | tail -1
