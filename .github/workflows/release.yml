name: release

# A version tag (v0.1.0) builds the addon zip with the BigWigs packager,
# pulling the libraries named in .pkgmeta, then publishes a GitHub release
# with the zip. With CF_API_KEY set as a repository secret the packager also
# uploads to CurseForge (the project id is in the TOC); WAGO_API_TOKEN does
# the same for Wago. Without them those uploads are skipped.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The packager gets no GitHub token on purpose: the step below is the
      # one and only path that creates the GitHub release. (The packager reads
      # GITHUB_OAUTH; giving it one would make both paths run.)
      - name: Package, upload to CurseForge and Wago
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Create the GitHub release with the packaged zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          ZIP=$(ls .release/*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then
            echo "No packaged zip found in .release/" >&2
            exit 1
          fi
          scripts/release-notes.sh > /tmp/notes.md
          # A tag with a suffix (v0.1.1-beta1) is a prerelease on GitHub, as the
          # packager already marks it beta/alpha on CurseForge.
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading zip"
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md $PRE
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file /tmp/notes.md $PRE
          fi
